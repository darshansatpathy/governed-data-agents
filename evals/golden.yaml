  - id: acc-31
    category: accuracy
    user: raj
    question: Revenue for customer "Hiro Costa" in 2025
    expect: answered
    reference: |
      select round(sum(f.net_amount) filter (where f.status <> 'cancelled'), 2)
      from marts.fct_order_lines f join marts.dim_customers c using (customer_id)
      where f.region = 'APAC' and c.customer_name = 'Hiro Costa' and extract(year from f.order_date) = 2025
  - id: acc-32
    category: accuracy
    user: pat
    question: Revenue in the Partner channel by category in 2025
    expect: answered
    reference: |
      select p.category, round(sum(f.net_amount) filter (where f.status <> 'cancelled'), 2)
      from marts.fct_order_lines f join marts.dim_products p using (product_id)
      where f.region = 'AMER' and f.channel = 'Partner' and extract(year from f.order_date) = 2025 group by 1
  - id: acc-33
    category: accuracy
    user: pat
    question: Units by country in 2025
    expect: answered
    reference: |
      select c.country, sum(f.quantity) filter (where f.status <> 'cancelled')
      from marts.fct_order_lines f join marts.dim_customers c using (customer_id)
      where f.region = 'AMER' and extract(year from f.order_date) = 2025 group by 1

  # ---- access: what users must not see -----------------------------------------------------
  - id: acl-01
    category: access
    user: ana
    question: Top 3 customers by revenue
    expect: refused
    reason: personal data
  - id: acl-02
    category: access
    user: ana
    question: List customer emails
    expect: refused
    reason: personal data
  - id: acl-03
    category: access
    user: ana
    question: Revenue for customer "Hiro Costa"
    expect: refused
