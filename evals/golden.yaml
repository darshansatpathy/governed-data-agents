# Evaluation cases. Each "answered" case has a reference query written by hand and run as the
# warehouse owner, which bypasses row-level security, so every reference states the user's
# region scope explicitly. The service's answer must match it exactly.
#
# Abbreviations used in references: f = marts.fct_order_lines, c = marts.dim_customers,
# p = marts.dim_products. "Not cancelled" is part of every measure except cancelled_orders.
as_of: 2026-01-15

cases:
  # ---- accuracy: global finance user ------------------------------------------------------
  - id: acc-01
    category: accuracy
    user: gina
    question: What was revenue by region in 2025?
    expect: answered
    reference: |
      select region, round(sum(net_amount) filter (where status <> 'cancelled'), 2)
      from marts.fct_order_lines where order_date >= '2025-01-01' and order_date < '2026-01-01'
      group by 1 order by 2 desc
  - id: acc-02
    category: accuracy
    user: gina
    question: Total revenue last year
    expect: answered
    reference: |
      select round(sum(net_amount) filter (where status <> 'cancelled'), 2)
      from marts.fct_order_lines where order_date between '2025-01-01' and '2025-12-31'
  - id: acc-03
    category: accuracy
    user: gina
    question: Revenue by quarter in 2025
    expect: answered
    reference: |
      select date_trunc('quarter', order_date)::date, round(sum(net_amount) filter (where status <> 'cancelled'), 2)
      from marts.fct_order_lines where extract(year from order_date) = 2025 group by 1 order by 1
  - id: acc-04
    category: accuracy
    user: gina
    question: Monthly orders in 2025
    expect: answered
    reference: |
      select date_trunc('month', order_date)::date, count(distinct order_id) filter (where status <> 'cancelled')
      from marts.fct_order_lines where extract(year from order_date) = 2025 group by 1 order by 1
  - id: acc-05
    category: accuracy
    user: gina
    question: Top 5 products by revenue in Q4 2025
    expect: answered
    ordered: true
    reference: |
      select p.product_name, round(sum(f.net_amount) filter (where f.status <> 'cancelled'), 2) as r
      from marts.fct_order_lines f join marts.dim_products p using (product_id)
      where f.order_date >= '2025-10-01' and f.order_date < '2026-01-01'
      group by 1 order by r desc limit 5
  - id: acc-06
    category: accuracy
    user: gina
    question: Which category had the highest revenue last year?
    expect: answered
    reference: |
      select p.category, round(sum(f.net_amount) filter (where f.status <> 'cancelled'), 2) as r
      from marts.fct_order_lines f join marts.dim_products p using (product_id)
      where extract(year from f.order_date) = 2025 group by 1 order by r desc limit 1
  - id: acc-07
    category: accuracy
    user: gina
    question: Revenue by segment and channel
    expect: answered
    reference: |
      select c.segment, f.channel, round(sum(f.net_amount) filter (where f.status <> 'cancelled'), 2)
      from marts.fct_order_lines f join marts.dim_customers c using (customer_id) group by 1, 2
  - id: acc-08
    category: accuracy
    user: gina
    question: Average order value by segment in 2025
    expect: answered
    reference: |
      select c.segment,
             round(sum(f.net_amount) filter (where f.status <> 'cancelled')
                   / count(distinct f.order_id) filter (where f.status <> 'cancelled'), 2)
      from marts.fct_order_lines f join marts.dim_customers c using (customer_id)
      where extract(year from f.order_date) = 2025 group by 1
  - id: acc-09
    category: accuracy
    user: gina
    question: Discount rate by category
    expect: answered
    reference: |
      select p.category,
             round(sum(f.discount_amount) filter (where f.status <> 'cancelled')
                   / sum(f.gross_amount) filter (where f.status <> 'cancelled'), 4)
      from marts.fct_order_lines f join marts.dim_products p using (product_id) group by 1
  - id: acc-10
    category: accuracy
    user: gina
    question: How many customers bought software in H1 2025?
    expect: answered
    reference: |
      select count(distinct f.customer_id) filter (where f.status <> 'cancelled')
      from marts.fct_order_lines f join marts.dim_products p using (product_id)
      where p.category = 'Software' and f.order_date >= '2025-01-01' and f.order_date < '2025-07-01'
  - id: acc-11
    category: accuracy
    user: gina
    question: Revenue excluding hardware by region
    expect: answered
    reference: |
      select f.region, round(sum(f.net_amount) filter (where f.status <> 'cancelled'), 2)
      from marts.fct_order_lines f join marts.dim_products p using (product_id)
      where p.category <> 'Hardware' group by 1
  - id: acc-12
    category: accuracy
    user: gina
    question: Units sold in the Partner channel between 2025-03-01 and 2025-03-31
    expect: answered
    reference: |
      select sum(quantity) filter (where status <> 'cancelled') from marts.fct_order_lines
      where channel = 'Partner' and order_date between '2025-03-01' and '2025-03-31'
  - id: acc-13
    category: accuracy
    user: gina
    question: How many orders were cancelled in 2025?
    expect: answered
    reference: |
      select count(distinct order_id) from marts.fct_order_lines
      where status = 'cancelled' and extract(year from order_date) = 2025
  - id: acc-14
    category: accuracy
    user: gina
    question: Returned orders by region in 2025
    expect: answered
    reference: |
      select region, count(distinct order_id) from marts.fct_order_lines
      where status = 'returned' and extract(year from order_date) = 2025 group by 1
  - id: acc-15
    category: accuracy
    user: gina
    question: Gross revenue and discounts by region in Q3 2025
    expect: answered
    reference: |
      select region,
             round(sum(gross_amount) filter (where status <> 'cancelled'), 2),
             round(sum(discount_amount) filter (where status <> 'cancelled'), 2)
      from marts.fct_order_lines where order_date >= '2025-07-01' and order_date < '2025-10-01' group by 1
  - id: acc-16
    category: accuracy
    user: gina
    question: Bottom 3 countries by revenue in 2025
    expect: answered
    ordered: true
    reference: |
      select c.country, round(sum(f.net_amount) filter (where f.status <> 'cancelled'), 2) as r
      from marts.fct_order_lines f join marts.dim_customers c using (customer_id)
      where extract(year from f.order_date) = 2025 group by 1 order by r asc limit 3
  - id: acc-17
    category: accuracy
    user: gina
    question: Revenue in EMEA and APAC by quarter in 2025
    expect: answered
    reference: |
      select date_trunc('quarter', order_date)::date, round(sum(net_amount) filter (where status <> 'cancelled'), 2)
      from marts.fct_order_lines where region in ('EMEA', 'APAC') and extract(year from order_date) = 2025 group by 1
  - id: acc-18
    category: accuracy
    user: gina
    question: Show me the sales trend for Enterprise customers in 2025
    expect: answered
    reference: |
      select date_trunc('month', f.order_date)::date, round(sum(f.net_amount) filter (where f.status <> 'cancelled'), 2)
      from marts.fct_order_lines f join marts.dim_customers c using (customer_id)
      where c.segment = 'Enterprise' and extract(year from f.order_date) = 2025 group by 1
  - id: acc-19
    category: accuracy
    user: gina
    question: Revenue by country in Q1 2025 for SMB
    expect: answered
    reference: |
      select c.country, round(sum(f.net_amount) filter (where f.status <> 'cancelled'), 2)
      from marts.fct_order_lines f join marts.dim_customers c using (customer_id)
      where c.segment = 'SMB' and f.order_date >= '2025-01-01' and f.order_date < '2025-04-01' group by 1
  - id: acc-20
    category: accuracy
    user: gina
    question: Number of orders by channel since 2025-10-01
    expect: answered
    reference: |
      select channel, count(distinct order_id) filter (where status <> 'cancelled')
      from marts.fct_order_lines where order_date >= '2025-10-01' and order_date <= '2026-01-15' group by 1
  - id: acc-21
    category: accuracy
    user: gina
    question: Weekly revenue in December 2025
    expect: answered
    reference: |
      select date_trunc('week', order_date)::date, round(sum(net_amount) filter (where status <> 'cancelled'), 2)
      from marts.fct_order_lines where order_date >= '2025-12-01' and order_date < '2026-01-01' group by 1
  - id: acc-22
    category: accuracy
    user: gina
    question: Top 3 products by units in 2025
    expect: answered
    ordered: true
    reference: |
      select p.product_name, sum(f.quantity) filter (where f.status <> 'cancelled') as u
      from marts.fct_order_lines f join marts.dim_products p using (product_id)
      where extract(year from f.order_date) = 2025 group by 1 order by u desc, 1 limit 3
  - id: acc-23
    category: accuracy
    user: gina
    question: Orders in the Online channel by segment last quarter
    expect: answered
    reference: |
      select c.segment, count(distinct f.order_id) filter (where f.status <> 'cancelled')
      from marts.fct_order_lines f join marts.dim_customers c using (customer_id)
      where f.channel = 'Online' and f.order_date >= '2025-10-01' and f.order_date < '2026-01-01' group by 1
  - id: acc-24
    category: accuracy
    user: gina
    question: What were total discounts in 2024?
    expect: answered
    reference: |
      select round(sum(discount_amount) filter (where status <> 'cancelled'), 2)
      from marts.fct_order_lines where extract(year from order_date) = 2024

  # ---- accuracy: users with a region scope -------------------------------------------------
  - id: acc-25
    category: accuracy
    user: ana
    question: Monthly revenue in H2 2025
