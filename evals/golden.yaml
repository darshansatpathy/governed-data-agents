  - id: acc-30
    category: accuracy
    user: raj
    question: Average order value by channel in Q4 2025
    expect: answered
    reference: |
      select channel,
             round(sum(net_amount) filter (where status <> 'cancelled')
                   / count(distinct order_id) filter (where status <> 'cancelled'), 2)
