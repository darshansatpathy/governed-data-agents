  - id: acc-28
    category: accuracy
    user: raj
    question: Top 3 customers by revenue last year
    expect: answered
    ordered: true
    reference: |
      select c.customer_name, round(sum(f.net_amount) filter (where f.status <> 'cancelled'), 2) as r
      from marts.fct_order_lines f join marts.dim_customers c using (customer_id)
      where f.region = 'APAC' and extract(year from f.order_date) = 2025 group by 1 order by r desc limit 3
  - id: acc-29
    category: accuracy
    user: raj
    question: Revenue by country in 2025
    expect: answered
    reference: |
      select c.country, round(sum(f.net_amount) filter (where f.status <> 'cancelled'), 2)
