[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "governed-data-agents"
version = "0.1.1"
description = "Natural-language analytics over a semantic layer, with grants checked before SQL exists and row-level security enforced by PostgreSQL."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Darshan Kumar Satpathy" }]
keywords = ["semantic-layer", "text-to-sql", "row-level-security", "postgresql", "dbt", "llm", "data-governance", "agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Topic :: Database",
]
dependencies = [
  "psycopg[binary]>=3.2",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
dbt = ["dbt-core>=1.10,<1.13", "dbt-postgres>=1.9,<1.12"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "pip-audit>=2.7",
]

[project.scripts]
gda = "gda.cli:main"

[project.urls]
Repository = "https://github.com/darshansatpathy/governed-data-agents"

[tool.hatch.build.targets.wheel]
packages = ["src/gda"]

[tool.hatch.build.targets.wheel.force-include]
"semantic" = "gda/semantic"
"policies" = "gda/policies"
"evals" = "gda/evals"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["gda"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
fail_under = 90

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]
"scripts/*" = ["S311"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["gda"]
mypy_path = "src"
